services:
  - type: web
    name: research-chain
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: TOTP_ENC_KEY
        generateValue: true
      - key: DISABLE_DEMO
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: research-db
          property: connectionString

databases:
  - name: research-db
    databaseName: upsas
    user: upsas
