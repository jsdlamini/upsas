<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Research Chain">
  <!-- Entangled Violet tile -->
  <rect width="64" height="64" rx="14" fill="#6633E6"/>
  <!-- Bloch sphere: outline, axis, tilted equator, state vector -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <circle cx="32" cy="33" r="19" stroke-width="3"/>
    <line x1="32" y1="14" x2="32" y2="52" stroke-width="2.2" opacity=".45"/>
    <ellipse cx="32" cy="33" rx="19" ry="6.6" stroke-width="2.2" opacity=".6" transform="rotate(-22 32 33)"/>
    <line x1="32" y1="33" x2="45" y2="20" stroke-width="3.4"/>
  </g>
  <circle cx="45" cy="20" r="4" fill="#FFFFFF"/>
</svg>
